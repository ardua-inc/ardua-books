{% extends "base.html" %}

{% block content %}
<div class="auth-container">
  <div class="auth-card">
    <h2>Log in</h2>

    {% if form.errors %}
      <p class="auth-error">Your username and password didn't match. Please try again.</p>
    {% endif %}

    <form method="post" class="auth-form">
      {% csrf_token %}
      <div class="auth-field">
        <label for="{{ form.username.id_for_label }}">Username</label>
        <input type="text" name="username" id="{{ form.username.id_for_label }}"
               value="{{ form.username.value|default:'' }}" autocomplete="username" required>
      </div>
      <div class="auth-field">
        <label for="{{ form.password.id_for_label }}">Password</label>
        <input type="password" name="password" id="{{ form.password.id_for_label }}"
               autocomplete="current-password" required>
      </div>
{% load socialaccount %}

      <button type="submit" class="btn btn-primary auth-submit">Log in</button>
      
      <div class="auth-divider">
        <span>or</span>
      </div>
      
      <a href="{% provider_login_url 'google' %}" class="btn btn-secondary auth-submit google-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="18px" height="18px" style="margin-right: 8px;">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        Log in with Google
      </a>
    </form>
  </div>
</div>

<style>
.auth-container {
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 50vh;
}

.auth-card {
  background: #fff;
  border-radius: 8px;
  padding: 2.5rem;
  box-shadow: 0 2px 8px rgba(15, 23, 42, 0.12);
  max-width: 360px;
  width: 100%;
}

.auth-card h2 {
  margin: 0 0 1.5rem 0;
  color: #1f2933;
  text-align: center;
}

.auth-error {
  background: #fef2f2;
  border: 1px solid #fecaca;
  color: #b91c1c;
  padding: 0.75rem 1rem;
  border-radius: 6px;
  margin-bottom: 1.25rem;
  font-size: 0.9rem;
}

.auth-form {
  max-width: none;
}

.auth-field {
  margin-bottom: 1.25rem;
}

.auth-field label {
  display: block;
  margin-bottom: 0.5rem;
  font-weight: 500;
  color: #374151;
}

.auth-field input {
  width: 100%;
  padding: 0.625rem 0.875rem;
  border: 1px solid #d1d5db;
  border-radius: 6px;
  font-size: 1rem;
  transition: border-color 0.15s, box-shadow 0.15s;
}

.auth-field input:focus {
  outline: none;
  border-color: #0b5ed7;
  box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
}

.auth-submit {
  width: 100%;
  padding: 0.75rem 1rem;
  font-size: 1rem;
  margin-top: 0.5rem;
}

.auth-divider {
  display: flex;
  align-items: center;
  text-align: center;
  margin: 1.5rem 0;
  color: #9ca3af;
  font-size: 0.875rem;
}

.auth-divider::before,
.auth-divider::after {
  content: '';
  flex: 1;
  border-bottom: 1px solid #e5e7eb;
}

.auth-divider span {
  padding: 0 10px;
}

.google-btn {
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #fff;
  color: #374151;
  border: 1px solid #d1d5db;
  transition: background-color 0.15s;
}

.google-btn:hover {
  background-color: #f9fafb;
}
</style>
{% endblock %}
