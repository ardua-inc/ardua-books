services:
  web:
    image: ghcr.io/ardua-inc/ardua-books:latest
    env_file:
      - .env
    depends_on:
      db:
        condition: service_started
      db-backup:
        condition: service_started
      receipts-backup:
        condition: service_started        
    volumes:
      - media_volume:/app/media
    ports:
      - "8000:8000"
    restart: unless-stopped

  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    # Loopback only: reachable from books itself (and so over an SSH tunnel)
    # but never from the LAN -- ufw is inactive on this host, so publishing
    # on 0.0.0.0 would expose Postgres to every machine on the network.
    # Exists for the books_readonly reporting login (deploy/readonly_role.sql).
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 14
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
      BACKUP_SUFFIX: .dump
    volumes:
      - pg_backups:/backups
    depends_on:
      - db
    restart: unless-stopped

  db-backup-upload:
    image: rclone/rclone:latest
    env_file:
      - .env.backup
    entrypoint: ["rclone"]
    command:
      - sync
      - /backups
      - s3:ardua-books-backups/postgres
      - --config
      - /config/rclone/rclone.conf
      - --checksum
      - --verbose
    volumes:
      - pg_backups:/backups:ro
      - ./rclone:/config/rclone
    restart: "no"

  receipts-backup:
    image: rclone/rclone:latest
    env_file:
      - .env.backup
    entrypoint: ["rclone"]
    command:  
      - sync
      - /data/receipts
      - s3:ardua-books-backups/receipts
      - --config
      - /config/rclone/rclone.conf
      - --checksum
      - --verbose
    volumes:
      - media_volume:/data:ro
      - ./rclone:/config/rclone
    restart: no

volumes:
  db_data:
  media_volume:
  pg_backups:
